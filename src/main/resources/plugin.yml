name: WSMP-Classes
version: '1.0.0'
main: com.warriorssmp.classes.ClassesPlugin
api-version: '1.21'
author: WarriorsSMP
softdepend: [Vault, PlaceholderAPI]

commands:
  classmenu:
    description: Open your class menu (pick a class, view your skill tree, respec)
    aliases: [class, myclass]
  classeditor:
    description: Admin panel for WSMP-Classes
    permission: classes.admin
  cast:
    description: Cast your class's active spell (fireball, lightning, whirlwind, powershot) — reliable fallback for the item-based triggers
    usage: /cast <fireball|lightning|whirlwind|powershot>

permissions:
  classes.admin:
    description: Access to WSMP-Classes admin commands
    default: op
