# WSMP-Classes configuration
#
# Every ability is a real vanilla mechanic (potion effects, real extra
# arrows, real Ender Pearl damage) triggered off a real vanilla action —
# never an invented effect. See AbilityService in code for the 11 reusable
# ability behaviors every node below is built from; "upgrade" nodes are the
# same behavior with bigger numbers, not new code.
#
# TREE SHAPE (same for all three classes): 5 independent root nodes (1 point
# each) -> one upgrade per root (3 points each) -> one capstone requiring the
# original 3 "core identity" upgrades only, not the 2 side branches (5
# points) -> plus 2 standalone PASSIVE STAT BUFFS with no prerequisites,
# investable repeatedly (0-5 points each) instead of being a single unlock.
#
# The two buff nodes (a proc-chance booster and a max-health booster, one
# pair per class) aren't triggered abilities at all — no chance roll, no
# cooldown, no proc message. Each point is a permanent, always-on bonus:
# STAT_PROC_CHANCE_BOOST multiplies the trigger chance of every OTHER
# ability this player has, and STAT_MAX_HEALTH_BOOST applies a real vanilla
# max-health attribute modifier. Not everything in this tree has to be
# something you "use" — some of it is just being a little bit better at
# everything else.
#
# Investing in every single node in one class's tree — every root, every
# upgrade, the capstone, and maxing both buff nodes — costs 25 + 5 + 5 = 35
# points. The most anyone can ever earn is 19 (1 point per 5 levels, level
# 99). That gap is deliberate: nobody can max out a whole tree, so which
# roots you unlock, which upgrades you push, and how much you sink into the
# passive buffs instead is a real, lasting build choice (lasting until you
# pay for a respec — see settings below).

settings:
  points-per-level-interval: 5
  respec-cost: 5000.0
  class-change-cost: 15000.0
  respec-cooldown-days: 7
  class-change-cooldown-days: 7
  guide-book-cooldown-hours: 24
  pvp-xp-per-damage: 2.0
  pve-xp-per-damage: 0.3
  pvp-kill-bonus-xp: 50.0

  # Mage's base spell kit — always available from level 1, never gated by
  # the tree (right-click a Blaze Rod for Fireball, shift-right-click for
  # Lightning; thrown Snowballs are automatically enhanced into Iceballs).
  # The mage_fireball/mage_meteor/mage_archmages_wrath tree nodes make these
  # cheaper and stronger — they never unlock access from scratch.
  mana-max: 100.0
  mana-regen-amount: 5.0
  mana-regen-interval-seconds: 2
  fireball-mana-cost: 25.0
  fireball-base-damage: 5.0
  fireball-cooldown-seconds: 3
  lightning-mana-cost: 50.0
  lightning-base-damage: 8.0
  lightning-cooldown-seconds: 8
  iceball-bonus-damage: 2.0
  iceball-slowness-seconds: 3.0
  iceball-cooldown-seconds: 2

